apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alloy
spec:
  # Push target
  dependsOn:
    - name: loki
  patches: []
  components:
    - ../../${flux_git_path_to_root_from_clusters_dir}${flux_git_repo_path_base}/clusters/${cluster_location}/_components/alloy
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./flux/base/_template-helm
  prune: true
  postBuild:
    substitute:
      parent_kustomization: alloy # Current Kustomization name
    substituteFrom:
      - kind: ConfigMap
        name: vars-alloy
        optional: true
      - kind: Secret
        name: secrets-alloy
        optional: true
