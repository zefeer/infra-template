apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium
spec:
  dependsOn:
    - name: gateway-api-crds
  patches: []
  components:
    - ../../${flux_git_path_to_root_from_clusters_dir}${flux_git_repo_path_base}/clusters/${cluster_location}/${cluster_name}/_components/cilium
  interval: ${reconcilation_for_ks:="10m0s"}
  postBuild:
    substitute:
      parent_kustomization: cilium # Current Kustomization name
    substituteFrom:
      - kind: ConfigMap
        name: vars-cilium
        optional: true
      - kind: Secret
        name: secrets-cilium
        optional: true
  path: ./flux/base/_template-helm
  prune: true
