apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgres-operator
spec:
  dependsOn: []
  patches: []
  components: []
  interval: ${reconcilation_for_ks:="10m0s"}
  postBuild:
    substitute:
      parent_kustomization: postgres-operator # Current Kustomization name
    substituteFrom:
      - kind: ConfigMap
        name: vars-postgres-operator
        optional: true
      - kind: Secret
        name: secrets-postgres-operator
        optional: true
  path: ./flux/base/_template-helm
  prune: true
