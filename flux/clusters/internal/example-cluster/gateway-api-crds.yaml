apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api-crds
  labels:
    flux-component: skip_values
spec:
  dependsOn: []
  patches: []
  components: []
  interval: ${reconcilation_for_ks:=10m}
  postBuild:
    substitute:
      parent_kustomization: gateway-api-crds # Current Kustomization name
    substituteFrom:
      - kind: ConfigMap
        name: vars-gateway-api-crds
        optional: true
      - kind: Secret
        name: secrets-gateway-api-crds
        optional: true
  path: ./flux/base/gateway-api-crds/1.6.1
  targetNamespace: kube-system
  prune: false
