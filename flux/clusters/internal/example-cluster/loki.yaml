apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: loki
spec:
  # Prometheus Operator CRDs
  dependsOn:
    - name: prometheus-stack
  patches: []
  components:
    - ../../${flux_git_path_to_root_from_clusters_dir}${flux_git_repo_path_base}/clusters/${cluster_location}/_components/loki
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./flux/base/_template-helm
  prune: true
  postBuild:
    substitute:
      parent_kustomization: loki # Current Kustomization name
    substituteFrom:
      - kind: ConfigMap
        name: vars-loki
        optional: true
      - kind: Secret
        name: secrets-loki
        optional: true
