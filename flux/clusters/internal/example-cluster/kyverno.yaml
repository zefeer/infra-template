apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno
spec:
  dependsOn: []
  patches: []
  components:
    - ../../${flux_git_path_to_root_from_clusters_dir}${flux_git_repo_path_base}/clusters/_components/kyverno
  interval: ${reconcilation_for_ks:="10m0s"}
  postBuild:
    substitute:
      parent_kustomization: kyverno # Current Kustomization name
    substituteFrom:
      - kind: ConfigMap
        name: vars-kyverno
        optional: true
      - kind: Secret
        name: secrets-kyverno
        optional: true
  path: ./flux/base/_template-helm
  prune: true
