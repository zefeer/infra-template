apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns
spec:
  dependsOn: []
  patches: []
  components: []
  interval: ${reconcilation_for_ks:="10m0s"}
  postBuild:
    substitute:
      parent_kustomization: external-dns # Current Kustomization name
    substituteFrom:
      - kind: ConfigMap
        name: vars-external-dns
        optional: true
      - kind: Secret
        name: secrets-external-dns
        optional: true
  path: ./flux/base/_template-helm
  prune: true
