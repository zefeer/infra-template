## grafana/loki 7.3.0 (Loki 3.6.x), single-binary on local disk.
## Design notes: docs/observability.md

## Chart default is SimpleScalable (9+ pods)
deploymentMode: SingleBinary

loki:
  # Chart default is true: requires an X-Scope-OrgID header on every request
  auth_enabled: false

  commonConfig:
    # Chart default is 3
    replication_factor: 1

  # Chart default is s3
  storage:
    type: filesystem

  # Chart default is {}; Loki does not start without an explicit schema
  # https://grafana.com/docs/loki/latest/operations/storage/schema/#new-loki-installs
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  limits_config:
    retention_period: 72h
    # index/volume API: log volume histogram in Grafana Explore
    volume_enabled: true
    # Guard rails for a single-node cluster
    max_entries_limit_per_query: 5000
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16

  # Retention is enforced here; needs somewhere to persist delete requests
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

  ingester:
    chunk_encoding: snappy

  querier:
    max_concurrent: 2

  pattern_ingester:
    enabled: false

  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: local-path
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

## --- SimpleScalable components: 3 replicas each by default ---
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

## --- Disabled: memcached, nginx gateway, canary, test pod, bundled storage ---
## chunksCache defaults to allocatedMemory: 8192 (~9.6Gi request)
chunksCache:
  enabled: false
resultsCache:
  enabled: false
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false

## --- Self-monitoring ---
monitoring:
  serviceMonitor:
    enabled: true
  # ConfigMaps already labelled grafana_dashboard="1"
  dashboards:
    enabled: true
    namespace: monitoring
  # LokiRequestErrors / RequestPanics / RequestLatency / TooManyCompactorsRunning
  rules:
    enabled: true
    alerting: true
    configs:
      # Alerts on the canary disabled above
      LokiCanaryLatency:
        enabled: false
