apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

generatorOptions:
  # Stable names: alloy-config is referenced by the Alloy chart's volume mount
  disableNameSuffixHash: true
  annotations:
    # Alloy relabel rules and Grafana provisioning both use $-syntax that Flux
    # postBuild envsubst would eat
    kustomize.toolkit.fluxcd.io/substitute: disabled

configMapGenerator:
  # Alloy log collection pipeline, mounted by the Alloy DaemonSet
  - name: alloy-config
    namespace: monitoring
    behavior: create
    options:
      labels:
        flux-app: alloy
    files:
      - config.alloy

resources: []
