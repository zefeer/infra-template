apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources: []
patches: []
generatorOptions:
  disableNameSuffixHash: true
  labels:
    flux-role: values-configMap
    reconcile.fluxcd.io/watch: Enabled
configMapGenerator:
  - name: values-cert-manager
    behavior: create
    options:
      labels:
        flux-app: cert-manager
    files:
      - values.yaml=values-cert-manager.yaml
  - name: values-kyverno
    behavior: create
    options:
      labels:
        flux-app: kyverno
    files:
      - values.yaml=values-kyverno.yaml
  - name: values-kyverno-policy-reporter
    behavior: create
    options:
      labels:
        flux-app: kyverno-policy-reporter
    files:
      - values.yaml=values-kyverno-policy-reporter.yaml
