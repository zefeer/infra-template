---
# Source: kyverno-policies/templates/baseline/disallow-host-ports.cel.yaml
apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: disallow-host-ports
  annotations:
    policies.kyverno.io/title: Disallow hostPorts
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: "medium"
    policies.kyverno.io/subject: Pod
    kyverno.io/kyverno-version: v1.19.1
    kyverno.io/kubernetes-version: ">=1.25.0-0"
    policies.kyverno.io/description: >-
      Access to host ports allows potential snooping of network traffic and should not be allowed, or at minimum restricted to a known list. This policy ensures the `hostPort` field is unset or set to `0`.
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: "(!has(object.spec.containers) || object.spec.containers.all(c, \n  !has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0))) &&\n(!has(object.spec.initContainers) || object.spec.initContainers.all(c, \n  !has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0))) &&\n(!has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.all(c, \n  !has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0)))"
      message: >-
        Use of host ports is disallowed. The fields spec.containers[*].ports[*].hostPort , spec.initContainers[*].ports[*].hostPort, and spec.ephemeralContainers[*].ports[*].hostPort must either be unset or set to `0`.
  validationActions:
    - Audit
    - Deny
