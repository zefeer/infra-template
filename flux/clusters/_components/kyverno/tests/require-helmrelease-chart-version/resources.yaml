apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pinned
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cilium
      version: 1.20.2
      sourceRef:
        kind: HelmRepository
        name: kube-system-cilium
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pinned-v-prefix
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: gpu-operator
      version: v26.7.1
      sourceRef:
        kind: HelmRepository
        name: gpu-operator-nvidia
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pinned-prerelease
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: kyverno
      version: 3.10.0-rc.1
      sourceRef:
        kind: HelmRepository
        name: kyverno-kyverno
---
# What the template renders when helm_chartVersion is not set (API default "*")
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: no-version
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      sourceRef:
        kind: HelmRepository
        name: cert-manager-jetstack
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: star
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: external-dns
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: external-dns-external-dns
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: range
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: ">=92.0.0"
      sourceRef:
        kind: HelmRepository
        name: monitoring-prometheus-community
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wildcard-minor
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: postgres-operator
      version: 6.x
      sourceRef:
        kind: HelmRepository
        name: postgres-operator-postgres-operator
---
# Chart from Git: version is ignored by Flux, the Git ref pins it
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: git-source
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: ./charts/app
      sourceRef:
        kind: GitRepository
        name: app
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chart-ref
  namespace: flux-system
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: podinfo
