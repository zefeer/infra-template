apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: disallow-privileged-containers
policies:
  - ../../ValidatingPolicy-cluster-disallow-privileged-containers.yaml
exceptions:
  - ../../PolicyException-cilium.yaml
  - ../../PolicyException-generic-device-plugin.yaml
resources:
  - resources.yaml
results:
  - policy: disallow-privileged-containers
    isValidatingPolicy: true
    kind: Pod
    resources: [privileged-false]
    result: pass
  - policy: disallow-privileged-containers
    isValidatingPolicy: true
    kind: Pod
    resources: [privileged-true, cilium-agent-default, generic-device-plugin-default]
    result: fail
  - policy: disallow-privileged-containers
    isValidatingPolicy: true
    kind: Pod
    resources: [kube-system/cilium-agent]
    result: skip
  - policy: disallow-privileged-containers
    isValidatingPolicy: true
    kind: Pod
    resources: [kube-system/generic-device-plugin]
    result: skip
