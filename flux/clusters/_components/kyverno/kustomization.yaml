  - ValidatingPolicy-cluster-disallow-host-path.yaml
  - ValidatingPolicy-cluster-disallow-host-ports.yaml
  - ValidatingPolicy-cluster-disallow-host-process.yaml
  - ValidatingPolicy-cluster-disallow-latest-tag.yaml
