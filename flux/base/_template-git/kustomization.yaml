apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../_template-base/source-gitrepository.yaml
  - ../_template-base/release.yaml
  # - ../_template-base/components.yaml

patches:
  - patch: |-
      - op: replace
        path: /spec/chart/spec/sourceRef/kind
        value: GitRepository
    target:
      kind: HelmRelease
