extends: default

ignore:
  - flux/clusters/internal/example-cluster/_flux-system/
  # Vendored upstream releases, replaced as is on upgrade
  - flux/base/gateway-api-crds/

rules:
  line-length:
    max: 250
    allow-non-breakable-inline-mappings: true
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  document-start: disable
  indentation:
    spaces: 2
    indent-sequences: whatever # chart-derived values mix both list styles
  trailing-spaces:
    level: warning
  new-line-at-end-of-file:
    level: warning
